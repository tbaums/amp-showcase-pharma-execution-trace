[project]
name = "pharma-execution-trace"
version = "0.1.0"
description = "Pharma Flight Recorder — find the lie in your own trace."
requires-python = ">=3.10"
dependencies = [
    "crewai[anthropic]>=1.14.7,<2",
]

[project.scripts]
kickoff = "pharma_execution_trace.main:kickoff"

[tool.crewai]
type = "flow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharma_execution_trace"]
